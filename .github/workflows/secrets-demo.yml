---
name: Secrets Demo

on: workflow_dispatch

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check the secret exists (without printing it)
              env:
                  MY_SECRET: ${{ secrets.MY_SECRET_MESSAGE }}
              run: |
                  if [ -n "$MY_SECRET" ]; then
                    echo "MY_SECRET_MESSAGE is set"
                  else
                    echo "MY_SECRET_MESSAGE is NOT set"
                    exit 1
                  fi

            - name: Try to print it (masking test)
              env:
                  MY_SECRET: ${{ secrets.MY_SECRET_MESSAGE }}
              run: echo "The secret is $MY_SECRET"
