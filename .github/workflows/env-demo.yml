---
name: Env Demo

on: workflow_dispatch

env:
    APP_NAME: myapp

jobs:
    show:
        runs-on: ubuntu-latest
        env:
            ENVIRONMENT: staging
        steps:
            - name: Show all three levels
              env:
                  VERSION: "1.0.0"
              run: |
                  echo "App: $APP_NAME"
                  echo "Environment: $ENVIRONMENT"
                  echo "Version: $VERSION"

            - name: Override at step level
              env:
                  ENVIRONMENT: production
              run: echo "Environment in this step is $ENVIRONMENT"

            - name: Back to the job level
              run: |
                  echo "Environment is again $ENVIRONMENT"
                  echo "Version here is '${VERSION:-not set}'"

            - name: GitHub context values
              run: |
                  echo "Commit SHA: ${{ github.sha }}"
                  echo "Actor: ${{ github.actor }}"
                  echo "Branch: ${{ github.ref_name }}"
                  echo "Event: ${{ github.event_name }}"
