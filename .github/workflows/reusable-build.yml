---
name: Reusable Build

on:
  workflow_call:
    inputs:
      app_name:
        description: "Name of the app being built"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: false
        type: string
        default: staging
    secrets:
      docker_token:
        description: "Docker Hub access token"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show what we were asked to build
        run: |
          echo "App: ${{ inputs.app_name }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Commit: ${{ github.sha }}"

      - name: Check the secret arrived (without printing it)
        env:
          DOCKER_TOKEN: ${{ secrets.docker_token }}
        run: |
          if [ -n "$DOCKER_TOKEN" ]; then
            echo "docker_token was passed in"
          else
            echo "docker_token is MISSING"
            exit 1
          fi
