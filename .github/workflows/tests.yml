---
name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pytest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            # id: lets later steps read this step's outputs (cache-hit)
            - name: Cache pip downloads
              id: pipcache
              uses: actions/cache@v5
              with:
                  path: ~/.cache/pip
                  # Exact key: changes whenever requirements.txt changes
                  key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
                  # Fallback: newest cache that starts with this prefix
                  restore-keys: |
                      pip-${{ runner.os }}-

            - name: Report cache result
              run: |
                  echo "Exact cache hit: ${{ steps.pipcache.outputs.cache-hit }}"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run tests
              run: pytest -v
