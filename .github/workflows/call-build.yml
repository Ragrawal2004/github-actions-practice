---
name: Call Build

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build-myapp:
    uses: ./.github/workflows/reusable-build.yml
    with:
      app_name: myapp
      environment: production
    secrets:
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  use-version:
    needs: build-myapp
    runs-on: ubuntu-latest
    steps:
      - name: Use the version from the reusable workflow
        run: |
          echo "Build version: ${{ needs.build-myapp.outputs.build_version }}"
